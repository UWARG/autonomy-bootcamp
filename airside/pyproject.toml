[project]
name = "airside-engine"
version = "0.1.0"
description = "Perception behavior-tree engine: pure py_trees behaviors on the host, ROS plumbing in the container."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "py_trees>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/engine/tests"]
