[project]
name = "camera"
version = "0.1.0"
description = "Camera hardware abstraction layer: lifecycle contract, worked example, and the SimCamera assignment."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-bootcamp/tree/main/camera"
Issues = "https://github.com/UWARG/autonomy-bootcamp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
