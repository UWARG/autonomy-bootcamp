name: Publish SITL image

# Tag-triggered publish of the pinned ArduCopter SITL image. Tag a release as
# sitl/v<version> (e.g. sitl/v0.1.0) to build sitl/ and push
# ghcr.io/uwarg/bootcamp-sitl:<version> and :latest, then pin the printed
# digest in integration/compose.yaml.
on:
  push:
    tags:
      - "sitl/v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Parse and verify tag version
        id: version
        run: |
          version="${GITHUB_REF_NAME#sitl/v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Release tag '$GITHUB_REF_NAME' does not contain a valid semantic version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: sitl
          push: true
          tags: |
            ghcr.io/uwarg/bootcamp-sitl:${{ steps.version.outputs.version }}
            ghcr.io/uwarg/bootcamp-sitl:latest

  print-digest:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Print pushed digest for pinning
        run: |
          {
            echo "## bootcamp-sitl published"
            echo
            echo "- Tagged: \`ghcr.io/uwarg/bootcamp-sitl:${{ needs.build-and-push.outputs.version }}\`"
            echo "- Pin by digest in integration/compose.yaml:"
            echo
            echo '```'
            echo "ghcr.io/uwarg/bootcamp-sitl@${{ needs.build-and-push.outputs.digest }}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
