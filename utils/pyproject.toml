[project]
name = "utils"
version = "0.1.0"
description = "Waypoint parsing and ordering utilities (Bootcamp Part 3: testing)."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# TRY004 wants TypeError when an isinstance check fails; waypoint parsing
# deliberately raises ValueError for ALL malformed file content (see the
# docstrings in src/waypoint_utils.py).
ignore = ["TRY004"]
