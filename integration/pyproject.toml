[project]
name = "integration"
version = "0.1.0"
description = "Part 5: run the bootcamper's code against ArduPilot SITL via docker compose."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-bootcamp/tree/main/integration"
Issues = "https://github.com/UWARG/autonomy-bootcamp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
